site_name: Learning With Fjj
site_description: Soda的数字 IC、FPGA、计算机体系结构与 AI 加速器技术主页和知识库
site_author: Soda
site_url: https://zhedasuren.github.io/
repo_url: https://github.com/ZheDaSuRen/ZheDaSuRen.github.io
repo_name: ZheDaSuRen/ZheDaSuRen.github.io
edit_uri: ""
copyright: Copyright &copy; 2026 Soda

theme:
  name: material
  custom_dir: overrides
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search:
      lang:
        - zh
        - en

nav:
  - 主页: index.md
  - 项目:
      - 项目概览: projects/index.md
      - Mixed-Precision ANN/SNN PE: projects/mixed-precision-pe.md
      - Systolic Array: projects/systolic-array.md
      - CNN FPGA Deployment: projects/cnn-fpga.md
  - 研究:
      - 研究概览: research/index.md
  - 技术笔记:
      - 笔记首页: notes/index.md
      - 技术文章写作模板: notes/article-template.md
      - 秋招准备:
          - 秋招准备首页: course/index.md
          - 示例课程: course/example.md
  - 简历: resume/index.md
  - 关于:
      - 关于我: about/index.md
      - 联系方式: contact/index.md
      - 友链: friends/index.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - assets/javascripts/mermaid.min.js
  - assets/javascripts/mermaid.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2-3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ZheDaSuRen
      name: GitHub
